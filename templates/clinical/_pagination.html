{% if page_obj.paginator.num_pages > 1 %}<div style="margin-top:16px; display:flex; gap:8px; align-items:center;">{% if page_obj.has_previous %}<a class="btn btn-outline-secondary" href="?{% if query_without_page %}{{ query_without_page }}&{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="btn btn-outline-secondary" href="?{% if query_without_page %}{{ query_without_page }}&{% endif %}page={{ page_obj.next_page_number }}">Next</a>{% endif %}</div>{% endif %}
